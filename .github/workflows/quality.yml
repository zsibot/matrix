name: Repository quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fast-checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check documentation, tool syntax and release metadata
        run: python3 scripts/ci/check_repo.py
      - name: Check release packager interface
        run: bash scripts/build_release.sh --help
